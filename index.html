<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Geography Challenge</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .leaflet-container { width: 100%; height: 100%; border-radius: 0.5rem; z-index: 1; }
        .card-flip { perspective: 1000px; }
        .card-inner { position: relative; width: 100%; height: 100%; text-align: center; transition: transform 0.6s; transform-style: preserve-3d; }
        .card-front, .card-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 0.75rem; }
        .card-back { transform: rotateY(180deg); }
        .flipped .card-inner { transform: rotateY(180deg); }
        .custom-pin { display: flex; align-items: center; justify-content: center; }
        
        /* Animation Utilities */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- Inline Icons to prevent loading errors ---
        const Icon = ({ path, size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                {path}
            </svg>
        );

        const Icons = {
            Map: <path d="M9 11a3 3 0 1 0 6 0a3 3 0 0 0 -6 0" />, 
            Flag: <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1zM4 22v-7" />,
            Building: <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2" />,
            Globe: <path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" />, // Simplified globe
            Trophy: <path d="M8 21h8M12 17v4M7 4h10c0 8-3 13-8 13s-8-5-8-13c0-2 2-4 2-4h2" />,
            Swords: <path d="M14.5 17.5L3 6V3h3l11.5 11.5M13 19l6-6M19 13l2 2v3h-3l-2-2" />,
            ChevronRight: <path d="M9 18l6-6-6-6" />,
            Refresh: <path d="M23 4v6h-6M1 20v-6h6" />,
            Check: <path d="M20 6L9 17l-5-5" />,
            X: <path d="M18 6L6 18M6 6l12 12" />
        };

        // --- Game Constants ---
        const GAME_ROUNDS = 10;
        const MODES = {
            MENU: 'menu',
            MAP: 'map',
            FLAG: 'flag',
            CAPITAL: 'capital',
            CONTINENT: 'continent',
            FACTS: 'facts',
            GAMEOVER: 'gameover'
        };

        // --- Components ---

        const MapView = ({ lat, lng }) => {
            const mapRef = useRef(null);
            const mapInstanceRef = useRef(null);
            const markerRef = useRef(null);

            useEffect(() => {
                if (!mapRef.current) return;

                if (!mapInstanceRef.current) {
                    mapInstanceRef.current = L.map(mapRef.current, {
                        zoomControl: false,
                        attributionControl: false,
                        scrollWheelZoom: "center"
                    }).setView([lat, lng], 4);

                    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png', {
                        maxZoom: 19
                    }).addTo(mapInstanceRef.current);
                } else {
                    mapInstanceRef.current.setView([lat, lng], 4);
                }

                if (markerRef.current) {
                    markerRef.current.setLatLng([lat, lng]);
                } else {
                    const customIcon = L.divIcon({
                        className: 'custom-pin',
                        html: `<div style="background-color: #ef4444; width: 24px; height: 24px; border-radius: 50%; border: 3px solid white; box-shadow: 0 4px 6px rgba(0,0,0,0.3);"></div>`,
                        iconSize: [24, 24],
                        iconAnchor: [12, 12]
                    });
                    markerRef.current = L.marker([lat, lng], { icon: customIcon }).addTo(mapInstanceRef.current);
                }
                
                // Force map redraw to fix gray tiles
                setTimeout(() => {
                    mapInstanceRef.current.invalidateSize();
                }, 200);

            }, [lat, lng]);

            return <div ref={mapRef} className="h-64 w-full rounded-lg shadow-inner bg-gray-200 border border-gray-300"></div>;
        };

        const FactCard = ({ country, hidden, result, isPlayer, onStatClick, selectedStat }) => {
            if (!country) return <div className="h-96 w-full bg-gray-200 rounded-xl animate-pulse"></div>;

            const formatNum = (num) => {
                if (num >= 1e9) return (num / 1e9).toFixed(1) + 'B';
                if (num >= 1e6) return (num / 1e6).toFixed(1) + 'M';
                if (num >= 1e3) return (num / 1e3).toFixed(1) + 'k';
                return num;
            };

            const stats = [
                { label: 'Population', value: country.population, formatted: formatNum(country.population), id: 'pop' },
                { label: 'Area (km²)', value: country.area, formatted: formatNum(country.area), id: 'area' },
                { label: 'Borders', value: country.borders?.length || 0, formatted: country.borders?.length || 0, id: 'borders' },
                { label: 'Density', value: Math.round(country.population / (country.area || 1)), formatted: Math.round(country.population / (country.area || 1)) + '/km²', id: 'density' }
            ];

            return (
                <div className={`card-flip w-full h-96 ${hidden ? '' : 'flipped'}`}>
                    <div className="card-inner relative shadow-xl rounded-xl">
                        {/* Back */}
                        <div className="card-front bg-indigo-600 flex flex-col items-center justify-center text-white rounded-xl border-4 border-indigo-400">
                             <Icon path={Icons.Globe} size={64} className="mb-4 opacity-50" />
                            <h3 className="text-2xl font-bold">Opponent</h3>
                        </div>

                        {/* Front */}
                        <div className={`card-back bg-white text-gray-800 flex flex-col rounded-xl overflow-hidden border-4 transition-colors duration-300 ${result === 'win' ? 'border-green-500' : result === 'lose' ? 'border-red-500' : 'border-indigo-100'}`}>
                            <div className="h-32 bg-gray-100 relative">
                                <img src={country.flags.svg} alt="Flag" className="w-full h-full object-cover" />
                                <div className="absolute bottom-0 left-0 w-full bg-gradient-to-t from-black/70 to-transparent p-3 text-left">
                                    <h3 className="text-white font-bold text-xl truncate drop-shadow-md">{country.name.common}</h3>
                                </div>
                            </div>
                            
                            <div className="flex-1 p-4 flex flex-col gap-2">
                                {stats.map((stat) => (
                                    <button
                                        key={stat.id}
                                        disabled={!isPlayer || result !== null}
                                        onClick={() => isPlayer && onStatClick(stat)}
                                        className={`flex justify-between items-center p-3 rounded-lg transition-all ${
                                            isPlayer && result === null
                                                ? 'hover:bg-indigo-50 bg-gray-50 cursor-pointer border border-gray-200 hover:border-indigo-300 active:scale-95' 
                                                : 'bg-white border-b border-gray-100'
                                        } ${selectedStat === stat.id && result === 'win' ? 'bg-green-100 border-green-300' : ''}
                                           ${selectedStat === stat.id && result === 'lose' ? 'bg-red-100 border-red-300' : ''}
                                        `}
                                    >
                                        <span className="text-xs font-bold text-gray-500 uppercase tracking-wider">{stat.label}</span>
                                        <span className="font-bold text-indigo-900">{stat.formatted}</span>
                                    </button>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // --- Main App Logic ---
        function App() {
            const [countries, setCountries] = useState([]);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);
            
            const [mode, setMode] = useState(MODES.MENU);
            const [round, setRound] = useState(1);
            const [score, setScore] = useState(0);
            
            // Quiz
            const [currentQuestion, setCurrentQuestion] = useState(null);
            const [selectedAnswer, setSelectedAnswer] = useState(null);
            const [isCorrect, setIsCorrect] = useState(null);
            
            // Battle
            const [playerCard, setPlayerCard] = useState(null);
            const [cpuCard, setCpuCard] = useState(null);
            const [battleResult, setBattleResult] = useState(null); 
            const [revealed, setRevealed] = useState(false);
            const [selectedStat, setSelectedStat] = useState(null);

            useEffect(() => {
                let cancelled = false;
                const fetchCountries = async () => {
                    const sources = [
                        'https://restcountries.com/v3.1/all?fields=name,flags,capital,continents,population,area,borders,latlng,cca3',
                        'https://cdn.jsdelivr.net/npm/world-countries@5.1.0/countries.json',
                        'https://unpkg.com/world-countries@5.1.0/countries.json'
                    ];
                    const errors = [];
                    for (const url of sources) {
                        try {
                            const res = await fetch(url);
                            if (!res.ok) throw new Error('HTTP ' + res.status);
                            const data = await res.json();
                            if (!Array.isArray(data)) throw new Error('Unexpected country data format');
                            const valid = data.map(c => {
                                const region = c.region || '';
                                const subregion = c.subregion || '';
                                const continent = c.continents?.[0] ||
                                    (region === 'Americas'
                                        ? (subregion === 'South America' ? 'South America' : 'North America')
                                        : region);
                                const name = typeof c.name === 'string'
                                    ? { common: c.name }
                                    : c.name;
                                const flagSvg = c.flags?.svg ||
                                    (c.cca2 ? 'https://flagcdn.com/' + c.cca2.toLowerCase() + '.svg' : null);
                                return {
                                    ...c,
                                    name,
                                    flags: { ...c.flags, svg: flagSvg },
                                    continents: [continent],
                                    capital: Array.isArray(c.capital) ? c.capital :
                                        (typeof c.capital === 'string' ? [c.capital] : []),
                                    borders: Array.isArray(c.borders) ? c.borders : [],
                                    latlng: c.latlng || c.latLng || [],
                                    population: Number(c.population),
                                    area: Number(c.area)
                                };
                            }).filter(c =>
                                c.name?.common && c.flags?.svg &&
                                Number.isFinite(c.population) && c.population > 0 &&
                                Number.isFinite(c.area) && c.area > 0 &&
                                c.latlng?.length >= 2 && c.continents?.[0]
                            );
                            if (valid.length < 4) throw new Error('Only ' + valid.length + ' usable countries');
                            if (!cancelled) {
                                setCountries(valid);
                                setError(null);
                                setLoading(false);
                            }
                            return;
                        } catch (err) {
                            console.warn('Country source failed:', url, err);
                            errors.push(err.message);
                        }
                    }
                    if (!cancelled) {
                        setError('Unable to load country data. ' + errors.join(' / '));
                        setLoading(false);
                    }
                };
                fetchCountries();
                return () => { cancelled = true; };
            }, []);

            // Utilities
            const getRandomItems = (arr, n) => {
                const shuffled = [...arr].sort(() => 0.5 - Math.random());
                return shuffled.slice(0, n);
            };

            const generateQuestion = (gameMode) => {
                if (countries.length === 0) return;
                const selection = getRandomItems(countries, 4);
                const correct = selection[0];
                let options = [...selection].sort(() => 0.5 - Math.random());
                
                let q = { correctCountry: correct, options: options, type: gameMode };

                if (gameMode === MODES.CONTINENT) {
                    const real = correct.continents[0];
                    const all = ["Africa", "Europe", "Asia", "Oceania", "North America", "South America", "Antarctica"];
                    const wrongs = all.filter(c => c !== real);
                    const randomWrongs = getRandomItems(wrongs, 3);
                    const continentOptions = [real, ...randomWrongs].sort(() => 0.5 - Math.random());
                    q.options = continentOptions; 
                }

                setCurrentQuestion(q);
                setSelectedAnswer(null);
                setIsCorrect(null);
            };

            const startBattleRound = () => {
                if (countries.length < 2) return;
                const pair = getRandomItems(countries, 2);
                setPlayerCard(pair[0]);
                setCpuCard(pair[1]);
                setBattleResult(null);
                setRevealed(false);
                setSelectedStat(null);
            };

            const startGame = (selectedMode) => {
                setMode(selectedMode);
                setScore(0);
                setRound(1);
                if (selectedMode === MODES.FACTS) {
                    startBattleRound();
                } else {
                    generateQuestion(selectedMode);
                }
            };

            const handleQuizAnswer = (answer) => {
                if (selectedAnswer) return;
                setSelectedAnswer(answer);
                
                let correct = false;
                if (currentQuestion.type === MODES.CONTINENT) {
                    correct = answer === currentQuestion.correctCountry.continents[0];
                } else {
                    correct = answer.name.common === currentQuestion.correctCountry.name.common;
                }

                setIsCorrect(correct);
                if (correct) setScore(s => s + 1);

                setTimeout(() => {
                    if (round >= GAME_ROUNDS) {
                        setMode(MODES.GAMEOVER);
                    } else {
                        setRound(r => r + 1);
                        generateQuestion(mode);
                    }
                }, 1500);
            };

            const handleBattleStatClick = (stat) => {
                if (battleResult) return;
                setSelectedStat(stat.id);
                setRevealed(true);

                const getVal = (c, id) => {
                    if(id === 'density') return (c.population / (c.area || 1));
                    if(id === 'borders') return c.borders?.length || 0;
                    if(id === 'pop') return c.population || 0;
                    return c[id] || 0;
                }

                const pVal = getVal(playerCard, stat.id);
                const cVal = getVal(cpuCard, stat.id);

                let res = 'draw';
                if (pVal > cVal) res = 'win';
                if (pVal < cVal) res = 'lose';

                setBattleResult(res);
                if (res === 'win') setScore(s => s + 1);

                setTimeout(() => {
                    if (round >= GAME_ROUNDS) {
                        setMode(MODES.GAMEOVER);
                    } else {
                        setRound(r => r + 1);
                        startBattleRound();
                    }
                }, 2500);
            };

            // Views
            if (loading) return (
                <div className="min-h-screen bg-indigo-900 flex items-center justify-center text-white">
                    <div className="flex flex-col items-center gap-4 animate-pulse">
                         <Icon path={Icons.Globe} size={48} className="animate-spin" />
                        <p className="text-xl font-light">Loading World Data...</p>
                    </div>
                </div>
            );

            if (error) return (
                <div className="min-h-screen flex flex-col items-center justify-center p-6 text-center">
                    <h1 className="text-2xl font-bold text-red-600">Country data unavailable</h1>
                    <p className="mt-4 max-w-lg text-gray-700">{error}</p>
                    <button onClick={() => window.location.reload()} className="mt-6 bg-indigo-600 text-white px-6 py-3 rounded-xl">Retry</button>
                </div>
            );

            // MENU
            if (mode === MODES.MENU) {
                const games = [
                    { id: MODES.MAP, title: 'Map Challenger', desc: 'Guess the country location', iconPath: Icons.Map, color: 'bg-emerald-500' },
                    { id: MODES.FLAG, title: 'Flag Master', desc: 'Identify the flag', iconPath: Icons.Flag, color: 'bg-blue-500' },
                    { id: MODES.CAPITAL, title: 'Capital Cities', desc: 'Match country to capital', iconPath: Icons.Building, color: 'bg-purple-500' },
                    { id: MODES.CONTINENT, title: 'Continents', desc: 'Where is this country?', iconPath: Icons.Globe, color: 'bg-amber-500' },
                    { id: MODES.FACTS, title: 'Fact Battle', desc: 'Higher stats win!', iconPath: Icons.Swords, color: 'bg-rose-500' },
                ];

                return (
                    <div className="min-h-screen flex flex-col items-center py-10 px-4 animate-fade-in">
                        <div className="max-w-md w-full">
                            <header className="mb-8 text-center">
                                <h1 className="text-4xl font-extrabold text-indigo-900 mb-2 tracking-tight">World Games</h1>
                                <p className="text-gray-500">Select a game mode</p>
                            </header>

                            <div className="grid gap-4">
                                {games.map((game) => (
                                    <button
                                        key={game.id}
                                        onClick={() => startGame(game.id)}
                                        className="group relative overflow-hidden bg-white p-6 rounded-2xl shadow-sm border-2 border-transparent hover:border-indigo-100 hover:shadow-xl transition-all duration-300 text-left flex items-center"
                                    >
                                        <div className={`${game.color} p-4 rounded-xl text-white mr-5 shadow-md group-hover:scale-110 transition-transform`}>
                                            <Icon path={game.iconPath} size={28} />
                                        </div>
                                        <div className="flex-1">
                                            <h3 className="text-xl font-bold text-gray-800">{game.title}</h3>
                                            <p className="text-sm text-gray-400">{game.desc}</p>
                                        </div>
                                        <div className="text-gray-300 group-hover:text-indigo-500 transform group-hover:translate-x-1 transition-all">
                                            <Icon path={Icons.ChevronRight} />
                                        </div>
                                    </button>
                                ))}
                            </div>
                        </div>
                    </div>
                );
            }

            // GAMEOVER
            if (mode === MODES.GAMEOVER) {
                const percentage = (score / GAME_ROUNDS) * 100;
                let message = "Good effort!";
                if (percentage >= 80) message = "World Expert!";
                else if (percentage >= 50) message = "Not bad!";

                return (
                    <div className="min-h-screen bg-indigo-900 flex items-center justify-center p-4 animate-fade-in">
                        <div className="bg-white rounded-3xl p-8 max-w-sm w-full text-center shadow-2xl">
                            <div className="inline-flex items-center justify-center w-20 h-20 bg-yellow-100 rounded-full mb-6">
                                <Icon path={Icons.Trophy} className="text-yellow-500" size={40} />
                            </div>
                            <h2 className="text-3xl font-bold text-gray-800 mb-2">{message}</h2>
                            <p className="text-gray-500 mb-6">You scored</p>
                            <div className="text-6xl font-black text-indigo-600 mb-8">
                                {score}<span className="text-2xl text-gray-400 font-medium">/{GAME_ROUNDS}</span>
                            </div>
                            
                            <button 
                                onClick={() => setMode(MODES.MENU)}
                                className="w-full py-4 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-bold text-lg transition-colors flex items-center justify-center gap-2"
                            >
                                <Icon path={Icons.Refresh} size={20} /> Play Again
                            </button>
                        </div>
                    </div>
                );
            }

            // FACT BATTLE
            if (mode === MODES.FACTS) {
                return (
                    <div className="min-h-screen bg-slate-100 flex flex-col py-6 px-4 animate-fade-in">
                        <div className="flex justify-between items-center max-w-3xl mx-auto w-full mb-6">
                           <button onClick={() => setMode(MODES.MENU)} className="p-2 hover:bg-slate-200 rounded-lg text-slate-600 font-bold">Exit</button>
                           <div className="bg-white px-6 py-2 rounded-full shadow-sm font-bold text-slate-700">
                             Round {round}/{GAME_ROUNDS} • Score: {score}
                           </div>
                        </div>

                        <div className="flex-1 flex flex-col md:flex-row gap-6 max-w-4xl mx-auto w-full items-center justify-center">
                            <div className="w-full md:w-1/2 max-w-sm relative">
                                <div className="absolute -top-10 left-0 w-full text-center">
                                    <span className="bg-indigo-600 text-white px-4 py-1 rounded-full text-sm font-bold shadow-md">YOU</span>
                                </div>
                                <FactCard 
                                    country={playerCard} 
                                    hidden={false} 
                                    isPlayer={true} 
                                    result={battleResult} 
                                    onStatClick={handleBattleStatClick}
                                    selectedStat={selectedStat}
                                />
                            </div>

                            <div className="z-10 bg-white p-3 rounded-full shadow-xl border-4 border-slate-100 hidden md:block">
                                <Icon path={Icons.Swords} size={32} className="text-slate-800" />
                            </div>

                            <div className="w-full md:w-1/2 max-w-sm relative">
                                <div className="absolute -top-10 left-0 w-full text-center">
                                    <span className="bg-slate-700 text-white px-4 py-1 rounded-full text-sm font-bold shadow-md">CPU</span>
                                </div>
                                <FactCard 
                                    country={cpuCard} 
                                    hidden={!revealed} 
                                    isPlayer={false} 
                                    result={battleResult === 'win' ? 'lose' : battleResult === 'lose' ? 'win' : battleResult}
                                    selectedStat={selectedStat}
                                />
                            </div>
                        </div>
                        <div className="text-center mt-8 h-8">
                             {battleResult && (
                                <span className={`text-2xl font-bold animate-pulse ${battleResult === 'win' ? 'text-green-600' : battleResult === 'lose' ? 'text-red-600' : 'text-gray-600'}`}>
                                    {battleResult === 'win' ? 'YOU WIN!' : battleResult === 'lose' ? 'CPU WINS!' : 'DRAW!'}
                                </span>
                             )}
                        </div>
                    </div>
                );
            }

            // QUIZ
            if (currentQuestion) {
                const { correctCountry, options, type } = currentQuestion;
                
                return (
                    <div className="min-h-screen bg-slate-50 flex flex-col animate-fade-in">
                        <div className="bg-white border-b border-gray-200 p-4 sticky top-0 z-20 shadow-sm">
                            <div className="max-w-2xl mx-auto flex justify-between items-center">
                                <button onClick={() => setMode(MODES.MENU)} className="text-gray-500 font-medium hover:text-gray-800">Quit</button>
                                <div className="flex gap-4">
                                   <div className="flex items-center gap-2 text-indigo-600 font-bold bg-indigo-50 px-3 py-1 rounded-full">
                                     <Icon path={Icons.Trophy} size={16} /> {score}
                                   </div>
                                   <div className="flex items-center gap-2 text-gray-500 bg-gray-100 px-3 py-1 rounded-full font-medium">
                                     Round {round}/{GAME_ROUNDS}
                                   </div>
                                </div>
                            </div>
                        </div>

                        <div className="flex-1 flex flex-col items-center p-4 max-w-2xl w-full mx-auto">
                            <div className="w-full bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden mb-6 p-6 flex flex-col items-center justify-center min-h-[300px]">
                                {type === MODES.MAP && (
                                    <div className="w-full flex flex-col items-center">
                                        <h2 className="text-xl font-bold text-gray-800 mb-4">Which country is marked?</h2>
                                        <MapView lat={correctCountry.latlng[0]} lng={correctCountry.latlng[1]} />
                                    </div>
                                )}

                                {type === MODES.FLAG && (
                                    <div className="flex flex-col items-center">
                                        <img src={correctCountry.flags.svg} alt="Flag" className="h-40 w-auto shadow-lg rounded-md mb-6 object-contain" />
                                        <h2 className="text-xl font-bold text-gray-800">Identify this flag</h2>
                                    </div>
                                )}

                                {type === MODES.CAPITAL && (
                                    <div className="text-center py-8">
                                        <p className="text-gray-500 uppercase tracking-wide font-bold mb-2">What is the capital of</p>
                                        <h2 className="text-4xl font-black text-indigo-900 mb-8">{correctCountry.name.common}?</h2>
                                    </div>
                                )}

                                {type === MODES.CONTINENT && (
                                    <div className="text-center flex flex-col items-center">
                                        <img src={correctCountry.flags.svg} alt="Flag" className="h-24 w-auto shadow-sm rounded mb-4 opacity-80" />
                                        <h2 className="text-3xl font-bold text-gray-800 mb-2">{correctCountry.name.common}</h2>
                                        <p className="text-gray-500">is located in which continent?</p>
                                    </div>
                                )}
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-3 w-full">
                                {options.map((option, idx) => {
                                    const isContinentMode = type === MODES.CONTINENT;
                                    const answerValue = option; 
                                    
                                    const isSelected = selectedAnswer === answerValue;
                                    let isCorrectOption = false;

                                    if(isContinentMode) {
                                        isCorrectOption = option === correctCountry.continents[0];
                                    } else {
                                        isCorrectOption = option.name.common === correctCountry.name.common;
                                    }
                                    
                                    let btnClass = "bg-white border-2 border-gray-100 hover:border-indigo-200 hover:bg-indigo-50 text-gray-700";
                                    let icon = null;

                                    if (selectedAnswer) {
                                        if (isCorrectOption) {
                                            btnClass = "bg-green-500 border-green-600 text-white shadow-md transform scale-105";
                                            icon = <Icon path={Icons.Check} />;
                                        }
                                        else if (isSelected) {
                                            btnClass = "bg-red-500 border-red-600 text-white opacity-50";
                                            icon = <Icon path={Icons.X} />;
                                        }
                                        else btnClass = "bg-gray-100 text-gray-400 border-gray-100";
                                    }

                                    const displayText = isContinentMode 
                                        ? option 
                                        : (type === MODES.CAPITAL 
                                            ? (option === correctCountry ? (correctCountry.capital?.[0] || 'N/A') : (option.capital?.[0] || option.name.common)) 
                                            : option.name.common);

                                    return (
                                        <button
                                            key={idx}
                                            disabled={!!selectedAnswer}
                                            onClick={() => handleQuizAnswer(answerValue)}
                                            className={`p-4 rounded-xl font-bold text-lg transition-all duration-200 shadow-sm flex justify-between items-center ${btnClass}`}
                                        >
                                            <span>{displayText}</span>
                                            {icon}
                                        </button>
                                    );
                                })}
                            </div>
                        </div>
                    </div>
                );
            }

            return null;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
